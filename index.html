<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ليالي الشام | المنيو الرسمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f2f2f7; /* لون خلفية آيفون */
            --main-text: #1c1c1e;
            --desc-text: #8e8e93;
            --accent: #d35400;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--main-text); line-height: 1.6; }

        header { 
            padding: 20px; text-align: center; background: var(--white); 
            box-shadow: 0 1px 0 rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100;
        }
        header h1 { font-weight: 800; font-size: 1.4rem; color: var(--accent); }

        .category-nav {
            display: flex; overflow-x: auto; white-space: nowrap; padding: 15px 10px; gap: 15px;
            scrollbar-width: none; background: var(--glass); backdrop-filter: blur(20px);
            position: sticky; top: 65px; z-index: 99; border-bottom: 0.5px solid rgba(0,0,0,0.1);
        }
        .category-nav::-webkit-scrollbar { display: none; }

        .cat-item { display: flex; flex-direction: column; align-items: center; min-width: 80px; cursor: pointer; }
        .cat-img-box {
            width: 60px; height: 60px; border-radius: 18px; background: #e5e5ea; margin-bottom: 8px;
            overflow: hidden; border: 2px solid transparent; transition: 0.3s;
        }
        .cat-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .cat-item.active .cat-img-box { border-color: var(--accent); transform: scale(1.05); }
        .cat-item span { font-size: 0.75rem; font-weight: 700; color: var(--desc-text); }
        .cat-item.active span { color: var(--accent); }

        .menu-list { padding: 15px; padding-bottom: 100px; max-width: 600px; margin: auto; }
        .food-card {
            background: var(--white); border-radius: 20px; margin-bottom: 12px; display: flex;
            padding: 12px; gap: 12px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .item-img-box { width: 90px; height: 90px; border-radius: 15px; overflow: hidden; background: #f2f2f7; flex-shrink: 0; }
        .item-img-box img { width: 100%; height: 100%; object-fit: cover; }

        .food-info { flex: 1; }
        .food-name { font-weight: 700; font-size: 1rem; margin-bottom: 2px; display: block; }
        .food-desc { font-size: 0.8rem; color: var(--desc-text); line-height: 1.3; display: block; margin-bottom: 6px; }
        
        .price-row { display: flex; justify-content: space-between; align-items: center; }
        .food-price { font-weight: 800; color: var(--accent); font-size: 0.95rem; }
        
        .add-btn {
            background: var(--accent); color: white; border: none; width: 32px; height: 32px;
            border-radius: 50%; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .add-btn:active { transform: scale(0.9); }

        /* أيقونة السلة العائمة */
        #cart-fab {
            position: fixed; bottom: 30px; left: 30px; background: var(--accent);
            color: white; padding: 15px 25px; border-radius: 30px; font-weight: 700;
            box-shadow: 0 10px 25px rgba(211, 84, 0, 0.3); z-index: 1000;
            display: none; align-items: center; gap: 10px; cursor: pointer;
        }

        /* نافذة السلة */
        .cart-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000; display: none;
            justify-content: center; align-items: flex-end;
        }
        .cart-content {
            background: var(--white); width: 100%; max-width: 500px; padding: 25px;
            border-radius: 30px 30px 0 0; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
        }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 0.5px solid #eee; }
        .del-btn { color: #ff3b30; font-size: 0.8rem; font-weight: 700; cursor: pointer; }

        .user-data { margin-top: 25px; display: flex; flex-direction: column; gap: 12px; }
        .user-data input {
            background: #f2f2f7; border: none; padding: 15px; border-radius: 12px;
            font-size: 0.9rem; outline: none; text-align: right;
        }
        .order-btn {
            background: #34c759; color: white; border: none; padding: 18px;
            border-radius: 15px; font-weight: 800; font-size: 1rem; margin-top: 20px; cursor: pointer;
        }
    </style>
</head>
<body>

    <header><h1>ليالي الشام</h1></header>
    <div class="category-nav" id="catNav"></div>

    <div class="menu-list" id="menuList">
        <div id="loader" style="text-align: center; margin-top: 50px;">بنجيب لك المنيو...</div>
    </div>

    <div id="cart-fab" onclick="toggleCart(true)">
        🛒 <span id="cart-count">0</span> طلبات
    </div>

    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h3>سلة الطلبات</h3>
                <span onclick="toggleCart(false)" style="cursor:pointer; font-weight: 800;">إغلاق</span>
            </div>
            <div id="cartItemsList"></div>
            
            <div class="user-data">
                <input type="text" id="userName" placeholder="الاسم بالكامل">
                <input type="tel" id="userPhone" placeholder="رقم الهاتف">
                <input type="text" id="userAddress" placeholder="العنوان بالتفصيل">
            </div>
            <button class="order-btn" onclick="sendOrder()">إرسال الطلب عبر واتساب</button>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRzOW2Z2TFsXm8b7uV8QcVqY1HKF0Qq-Dxyeq2c6avxRsm9PjqXGvM4yyIWRV30DqblUB3BEMeXpI-a/pub?output=csv';
        const IMAGES_PATH = "./images/"; 
        let menuData = [];
        let cart = [];

        async function loadMenu() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                menuData = rows.map(row => {
                    const col = row.split(',');
                    return {
                        category: col[0]?.trim(),
                        name: col[1]?.trim(),
                        price: col[2]?.trim(),
                        desc: col[3]?.trim() || "",
                        catImg: `${IMAGES_PATH}${col[0]?.trim()}.jpg`, 
                        itemImg: `${IMAGES_PATH}${col[1]?.trim()}.jpg`
                    };
                }).filter(i => i.name);
                renderNav();
                showCategory(menuData[0].category);
            } catch (e) { document.getElementById('loader').innerText = "خطأ في التحميل"; }
        }

        function renderNav() {
            const uniqueCats = [...new Map(menuData.map(item => [item.category, item])).values()];
            document.getElementById('catNav').innerHTML = uniqueCats.map((cat, idx) => `
                <div class="cat-item ${idx === 0 ? 'active' : ''}" onclick="showCategory('${cat.category}', this)">
                    <div class="cat-img-box"><img src="${cat.catImg}" onerror="this.src='${IMAGES_PATH}default.jpg'"></div>
                    <span>${cat.category}</span>
                </div>
            `).join('');
        }

        function showCategory(catName, el) {
            if(el) {
                document.querySelectorAll('.cat-item').forEach(btn => btn.classList.remove('active'));
                el.classList.add('active');
            }
            const items = menuData.filter(i => i.category === catName);
            document.getElementById('menuList').innerHTML = items.map(item => `
                <div class="food-card">
                    <div class="item-img-box"><img src="${item.itemImg}" onerror="this.src='${IMAGES_PATH}default.jpg'"></div>
                    <div class="food-info">
                        <span class="food-name">${item.name}</span>
                        <span class="food-desc">${item.desc}</span>
                        <div class="price-row">
                            <span class="food-price">${item.price} ج.م</span>
                            <button class="add-btn" onclick="addToCart('${item.name}', '${item.price}')">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(name, price) {
            cart.push({name, price});
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.length;
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-fab').style.display = count > 0 ? 'flex' : 'none';
            
            document.getElementById('cartItemsList').innerHTML = cart.map((item, idx) => `
                <div class="cart-item-row">
                    <span>${item.name} (${item.price} ج.م)</span>
                    <span class="del-btn" onclick="removeFromCart(${idx})">حذف</span>
                </div>
            `).join('');
        }

        function removeFromCart(idx) {
            cart.splice(idx, 1);
            updateCartUI();
            if(cart.length === 0) toggleCart(false);
        }

        function toggleCart(show) {
            document.getElementById('cartModal').style.display = show ? 'flex' : 'none';
        }

        function sendOrder() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const addr = document.getElementById('userAddress').value;

            if(!name || !phone || !addr) return alert("برجاء إكمال البيانات");

            let orderText = `طلب جديد من ليالي الشام\n\n`;
            orderText += `الاسم: ${name}\nالهاتف: ${phone}\nالعنوان: ${addr}\n\nالطلبات:\n`;
            cart.forEach(i => orderText += `- ${i.name} (${i.price} ج.م)\n`);
            
            const wpUrl = `https://wa.me/201234567890?text=${encodeURIComponent(orderText)}`;
            window.open(wpUrl, '_blank');
        }

        loadMenu();
    </script>
</body>
</html>
