<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Dining | Experience</title>
    <!-- Google Fonts: Serif للفخامة و Sans للبساطة -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #c5a059;
            --dark-bg: #0a0a0a;
            --glass-white: rgba(255, 255, 255, 0.05);
            --text-gray: #b5b5b5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
        }

        /* Luxury Background Header */
        header {
            height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80'); /* صورة تعبيرية عالية الجودة */
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Glassmorphism Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--glass-white);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--primary-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin: 0 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: 0.3s;
            opacity: 0.8;
        }

        nav ul li a:hover {
            color: var(--primary-gold);
            opacity: 1;
        }

        /* Hero Text */
        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            margin-bottom: 20px;
            background: linear-gradient(to bottom, #ffffff, #a1a1a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInDown 1.5s ease;
        }

        .hero-content p {
            font-size: 1.2rem;
            color: var(--text-gray);
            max-width: 600px;
            margin: 0 auto 30px;
            line-height: 1.8;
            animation: fadeInUp 1.5s ease;
        }

        /* Premium Button */
        .cta-button {
            padding: 15px 40px;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: 0.5s;
            position: relative;
            overflow: hidden;
        }

        .cta-button:hover {
            background: var(--primary-gold);
            color: black;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .hero-content h1 { font-size: 3rem; }
            nav { padding: 20px; }
            nav ul { display: none; } /* يفضل استبدالها بـ Burger Menu لاحقاً */
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">LUXURY LOGO</div>
        <ul>
            <li><a href="#home">الرئيسية</a></li>
            <li><a href="#menu">المنيو</a></li>
            <li><a href="#about">قصتنا</a></li>
            <li><a href="#contact">اتصل بنا</a></li>
        </ul>
    </nav>

    <header id="home">
        <div class="hero-content">
            <h1>فن المذاق الرفيع</h1>
            <p>تجربة طعام استثنائية تجمع بين الأصالة والحداثة في قلب فرعنا الوحيد والمميز.</p>
            <a href="#menu" class="cta-button">اكتشف القائمة</a>
        </div>
    </header>

</body>
</html>
