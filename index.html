<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منيو أبو خضر - Luxury Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --gold: #c5a059; --dark-bg: #050505; --card-bg: #111; --text-muted: #666; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }

        /* Header & Brand */
        .header { height: 240px; background: linear-gradient(to bottom, rgba(0,0,0,0.2), var(--dark-bg)), url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=800'); background-size: cover; background-position: center; position: relative; }
        .logo-area { position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%); text-align: center; width: 100%; }
        .logo-circle { width: 100px; height: 100px; background: var(--card-bg); border: 3px solid var(--gold); border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .brand-name { margin-top: 15px; font-size: 1.8rem; font-weight: 700; color: var(--gold); }
        .brand-sub { font-size: 0.7rem; color: #444; letter-spacing: 2px; text-transform: uppercase; }

        /* Navigation - Smooth Scroll Icons */
        .category-nav { margin-top: 100px; display: flex; overflow-x: auto; padding: 15px; gap: 20px; position: sticky; top: 0; background: rgba(5,5,5,0.95); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid #1a1a1a; scrollbar-width: none; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-item { min-width: 80px; text-align: center; opacity: 0.4; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .cat-item.active { opacity: 1; color: var(--gold); transform: translateY(-3px); }
        .cat-icon { width: 55px; height: 55px; background: #161616; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; border: 1px solid rgba(197,160,89,0.1); font-size: 1.4rem; transition: 0.3s; }
        .cat-item.active .cat-icon { border-color: var(--gold); background: rgba(197,160,89,0.05); box-shadow: 0 5px 15px rgba(197,160,89,0.1); }
        .cat-item span { font-size: 0.85rem; font-weight: 600; }

        /* Menu Content */
        .menu-container { padding: 20px; max-width: 600px; margin: 0 auto; }
        .section-header { position: sticky; top: 105px; background: var(--dark-bg); padding: 15px 0; z-index: 90; margin-bottom: 10px; }
        .section-title { color: var(--gold); font-size: 1.4rem; font-weight: 700; border-right: 5px solid var(--gold); padding-right: 15px; display: flex; align-items: center; gap: 10px; }
        
        /* Food Cards - Luxury Glassmorphism Style */
        .food-card { background: var(--card-bg); border-radius: 20px; padding: 15px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; border: 1px solid #1a1a1a; animation: fadeInUp 0.5s ease backwards; }
        .food-info { flex: 1; }
        .food-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; color: #fff; letter-spacing: 0.5px; }
        
        /* التعديل المطلوب: وصف صغير ومنسق جداً */
        .food-desc { font-size: 0.72rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px; font-weight: 400; opacity: 0.9; }
        
        .food-footer { display: flex; justify-content: space-between; align-items: center; }
        .food-price { color: var(--gold); font-weight: 700; font-size: 1.1rem; }
        .food-price span { font-size: 0.7rem; margin-right: 4px; opacity: 0.8; }
        .add-btn { background: #0a1f19; color: var(--gold); border: 1.5px solid var(--gold); width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; }
        
        .food-img-wrapper { position: relative; width: 110px; height: 110px; flex-shrink: 0; }
        .food-img { width: 100%; height: 100%; border-radius: 15px; object-fit: cover; border: 1px solid #222; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <div class="logo-circle">أ</div>
            <h1 class="brand-name">أبو خضر</h1>
            <p class="brand-sub">Premium Dining Experience</p>
        </div>
    </div>

    <div class="category-nav" id="catNav"></div>
    <div class="menu-container" id="menuContent"></div>

    <script>
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzOW2Z2TFsXm8b7uV8QcVqY1HKF0Qq-Dxyeq2c6avxRsm9PjqXGvM4yyIWRV30DqblUB3BEMeXpI-a/pub?output=csv";
        const imgBaseUrl = "https://raw.githubusercontent.com/YOUR_USER/YOUR_REPO/main/images/";

        async function fetchAndRender() {
            try {
                const response = await fetch(sheetUrl);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                
                const menuItems = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return {
                        category: cols[0]?.replace(/"/g, '').trim(),
                        name: cols[1]?.replace(/"/g, '').trim(),
                        desc: cols[2]?.replace(/"/g, '').trim(),
                        price: cols[3]?.replace(/"/g, '').trim(),
                        image: cols[4]?.replace(/"/g, '').trim()
                    };
                }).filter(item => item.name);

                const sections = [...new Set(menuItems.map(item => item.category))];
                const nav = document.getElementById('catNav');
                const content = document.getElementById('menuContent');

                sections.forEach((sec, idx) => {
                    // تصنيف الأيقونات تلقائياً بناءً على الاسم (اختياري)
                    const icon = sec.includes('كريب') ? 'fa-utensils' : 'fa-hamburger';
                    
                    nav.innerHTML += `
                        <div class="cat-item ${idx===0?'active':''}" onclick="scrollToSection(this, 'sec-${idx}')">
                            <div class="cat-icon"><i class="fas ${icon}"></i></div>
                            <span>${sec}</span>
                        </div>`;

                    let sectionHtml = `
                        <div class="section-header" id="sec-${idx}">
                            <h2 class="section-title">${sec}</h2>
                        </div>`;

                    menuItems.filter(i => i.category === sec).forEach((item, itemIdx) => {
                        sectionHtml += `
                            <div class="food-card" style="animation-delay: ${itemIdx * 0.1}s">
                                <div class="food-info">
                                    <h3 class="food-name">${item.name}</h3>
                                    <p class="food-desc">${item.desc}</p>
                                    <div class="food-footer">
                                        <div class="food-price">${item.price} <span>EGP</span></div>
                                        <div class="add-btn"><i class="fas fa-plus"></i></div>
                                    </div>
                                </div>
                                <div class="food-img-wrapper">
                                    <img src="${imgBaseUrl}${item.image}" class="food-img" onerror="this.src='https://via.placeholder.com/110/111/c5a059?text=Menu'">
                                </div>
                            </div>`;
                    });
                    content.innerHTML += sectionHtml;
                });

            } catch (err) { console.error("Data Fetch Error"); }
        }

        function scrollToSection(el, id) {
            document.querySelectorAll('.cat-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            const target = document.getElementById(id);
            window.scrollTo({ top: target.offsetTop - 100, behavior: 'smooth' });
        }

        fetchAndRender();
    </script>
</body>
</html>
