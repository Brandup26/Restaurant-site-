<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منيو أبو خضر الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --emerald: #062c21; --gold: #c5a059; --dark-bg: #050505;
            --card-bg: #121212; --text-gray: #a0a0a0; --transition: all 0.4s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--dark-bg); color: #fff; font-family: 'Cairo', sans-serif; overflow-x: hidden; }

        /* Arc & Logo */
        .header-container {
            height: 240px; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1000&q=80');
            background-size: cover; clip-path: ellipse(150% 100% at 50% 0%); position: relative;
        }
        .logo-wrapper { position: absolute; bottom: -45px; left: 50%; transform: translateX(-50%); z-index: 20; }
        .logo-circle { width: 95px; height: 95px; background: var(--card-bg); border: 2px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px #000; }
        .logo-circle span { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--gold); }

        /* Navigation */
        .category-nav { margin-top: 65px; display: flex; overflow-x: auto; padding: 15px; gap: 15px; position: sticky; top: 0; background: var(--dark-bg); z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.05); scrollbar-width: none; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-item { display: flex; flex-direction: column; align-items: center; min-width: 70px; cursor: pointer; opacity: 0.6; transition: 0.3s; }
        .cat-item.active { opacity: 1; transform: scale(1.1); }
        .cat-icon { width: 55px; height: 55px; background: rgba(255,255,255,0.03); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; border: 1px solid rgba(197, 160, 89, 0.1); color: var(--gold); font-size: 1.1rem; }
        .cat-item.active .cat-icon { background: var(--emerald); border-color: var(--gold); }
        .cat-item span { font-size: 0.7rem; font-weight: 600; }

        /* Menu */
        .menu-section { padding: 15px; min-height: 500px; }
        .section-title { color: var(--gold); margin: 25px 0 15px; display: flex; align-items: center; gap: 10px; font-size: 1.1rem; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to left, var(--gold), transparent); opacity: 0.2; }
        
        .food-card { background: var(--card-bg); border-radius: 18px; padding: 12px; margin-bottom: 12px; display: flex; gap: 12px; border: 1px solid rgba(255,255,255,0.02); animation: fadeInUp 0.5s ease forwards; }
        .food-info { flex: 1; }
        .food-name { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 3px; }
        .food-desc { font-size: 0.8rem; color: var(--text-gray); line-height: 1.3; margin-bottom: 10px; height: 32px; overflow: hidden; }
        .food-footer { display: flex; justify-content: space-between; align-items: center; }
        .food-price { color: var(--gold); font-weight: 700; }
        .add-btn { background: var(--emerald); color: var(--gold); border: 1px solid var(--gold); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .food-img { width: 95px; height: 95px; border-radius: 12px; object-fit: cover; background: #222; }

        /* Loading */
        #loader { text-align: center; padding: 50px; color: var(--gold); }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="header-container"><div class="logo-wrapper"><div class="logo-circle"><span>أ</span></div></div></header>
    
    <div style="text-align: center; margin-top: 50px;">
        <h1 style="font-family: 'Playfair Display'; color: var(--gold);">أبو خضر</h1>
        <p style="color: var(--text-gray); font-size: 0.8rem;">فخامة المذاق الأصيل</p>
    </div>

    <div class="category-nav" id="catNav">
        <!-- ستظهر الأقسام هنا تلقائياً -->
    </div>

    <div class="menu-section" id="menuContent">
        <div id="loader"><i class="fas fa-spinner fa-spin"></i> جاري تحميل المنيو الملكي...</div>
    </div>

    <script>
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzOW2Z2TFsXm8b7uV8QcVqY1HKF0Qq-Dxyeq2c6avxRsm9PjqXGvM4yyIWRV30DqblUB3BEMeXpI-a/pub?output=csv";
        
        // رابط الصور الأساسي على جيت هاب (استبدله برابطك الحقيقي لاحقاً)
        const imgBaseUrl = "https://raw.githubusercontent.com/YOUR_USER/YOUR_REPO/main/images/";

        async function fetchMenu() {
            try {
                const response = await fetch(sheetUrl);
                const data = await response.text();
                const rows = data.split('\n').slice(1); // تجاهل صف العناوين
                
                const menuData = rows.map(row => {
                    const cols = row.split(',');
                    return {
                        section: cols[0]?.trim(),
                        name: cols[1]?.trim(),
                        desc: cols[2]?.trim(),
                        price: cols[3]?.trim(),
                        photo: cols[4]?.trim()
                    };
                }).filter(item => item.name); // تجاهل الصفوف الفارغة

                renderMenu(menuData);
            } catch (error) {
                document.getElementById('menuContent').innerHTML = "خطأ في تحميل البيانات.";
            }
        }

        function renderMenu(data) {
            const menuContent = document.getElementById('menuContent');
            const catNav = document.getElementById('catNav');
            menuContent.innerHTML = "";
            catNav.innerHTML = "";

            // استخراج الأقسام الفريدة
            const sections = [...new Set(data.map(item => item.section))];

            sections.forEach((sec, index) => {
                // إضافة زر القسم في الناف بار
                const activeClass = index === 0 ? 'active' : '';
                catNav.innerHTML += `
                    <div class="cat-item ${activeClass}" onclick="scrollToSection('${sec}', this)">
                        <div class="cat-icon"><i class="fas fa-utensils"></i></div>
                        <span>${sec}</span>
                    </div>
                `;

                // إضافة القسم وعناصره
                let sectionHtml = `<h2 class="section-title" id="sec-${sec}">${sec}</h2>`;
                const items = data.filter(i => i.section === sec);
                
                items.forEach(item => {
                    sectionHtml += `
                        <div class="food-card">
                            <div class="food-info">
                                <h3 class="food-name">${item.name}</h3>
                                <p class="food-desc">${item.desc}</p>
                                <div class="food-footer">
                                    <span class="food-price">${item.price} EGP</span>
                                    <div class="add-btn"><i class="fas fa-plus"></i></div>
                                </div>
                            </div>
                            <img src="${imgBaseUrl}${item.photo}" class="food-img" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                        </div>
                    `;
                });
                menuContent.innerHTML += sectionHtml;
            });
        }

        function scrollToSection(id, el) {
            document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('sec-' + id).scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        fetchMenu();
    </script>
</body>
</html>
