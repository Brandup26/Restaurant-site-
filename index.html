<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منيو أبو خضر | فخامة المذاق</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --emerald: #062c21;
            --gold: #c5a059;
            --dark-bg: #050505;
            --card-bg: #111111;
            --text-gray: #a0a0a0;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--dark-bg); color: #fff; font-family: 'Cairo', sans-serif; overflow-x: hidden; }

        /* --- Arc Header --- */
        .header-container {
            height: 240px;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            clip-path: ellipse(150% 100% at 50% 0%);
            position: relative;
        }

        .logo-wrapper {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        .logo-circle {
            width: 90px;
            height: 90px;
            background: var(--card-bg);
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px #000;
        }

        .logo-circle span {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--gold);
        }

        /* --- Navigation --- */
        .category-nav {
            margin-top: 65px;
            display: flex;
            overflow-x: auto;
            padding: 15px;
            gap: 20px;
            position: sticky;
            top: 0;
            background: var(--dark-bg);
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            scrollbar-width: none;
        }
        .category-nav::-webkit-scrollbar { display: none; }

        .cat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
            cursor: pointer;
            opacity: 0.5;
            transition: var(--transition);
        }

        .cat-item.active { opacity: 1; transform: scale(1.05); }

        .cat-icon {
            width: 55px;
            height: 55px;
            background: rgba(255,255,255,0.03);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            border: 1px solid rgba(197, 160, 89, 0.1);
            color: var(--gold);
            font-size: 1.1rem;
        }

        .cat-item.active .cat-icon {
            background: var(--emerald);
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.2);
        }

        .cat-item span { font-size: 0.7rem; font-weight: 600; color: var(--text-gray); }
        .cat-item.active span { color: var(--gold); }

        /* --- Menu Section --- */
        .menu-section { padding: 15px; padding-bottom: 100px; }

        .section-title {
            color: var(--gold);
            margin: 30px 0 15px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to left, var(--gold), transparent);
            opacity: 0.2;
        }

        /* --- Food Card --- */
        .food-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.02);
            animation: fadeInUp 0.5s ease forwards;
        }

        .food-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }

        .food-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .food-desc {
            font-size: 0.75rem; /* صغير ومنظم */
            color: var(--text-gray);
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* سطرين فقط */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0.8;
        }

        .food-footer { display: flex; justify-content: space-between; align-items: center; }
        .food-price { color: var(--gold); font-weight: 700; font-size: 1rem; }

        .add-btn {
            background: var(--emerald);
            color: var(--gold);
            border: 1px solid var(--gold);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .food-img {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            object-fit: cover;
            background: #1a1a1a;
        }

        #loader { text-align: center; padding: 50px; color: var(--gold); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header class="header-container">
        <div class="logo-wrapper">
            <div class="logo-circle">
                <span>أ</span>
            </div>
        </div>
    </header>
    
    <div style="text-align: center; margin-top: 50px;">
        <h1 style="font-family: 'Playfair Display'; color: var(--gold); font-size: 1.6rem;">أبو خضر</h1>
        <p style="color: var(--text-gray); font-size: 0.8rem; letter-spacing: 1px;">THE ROYAL EXPERIENCE</p>
    </div>

    <div class="category-nav" id="catNav"></div>

    <div class="menu-section" id="menuContent">
        <div id="loader"><i class="fas fa-spinner fa-spin"></i> جاري تحميل المنيو...</div>
    </div>

    <script>
        // رابط الشيت الخاص بك
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzOW2Z2TFsXm8b7uV8QcVqY1HKF0Qq-Dxyeq2c6avxRsm9PjqXGvM4yyIWRV30DqblUB3BEMeXpI-a/pub?output=csv";
        
        // استبدل الرابط أدناه برابط مستودعك على جيت هاب
        const imgBaseUrl = "https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/images/";

        async function fetchMenu() {
            try {
                const response = await fetch(sheetUrl);
                const data = await response.text();
                const rows = data.split('\n').slice(1); 
                
                const menuData = rows.map(row => {
                    // معالجة الـ CSV مع مراعاة الفواصل داخل الوصف
                    const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    if (!cols) return null;
                    return {
                        section: cols[0]?.replace(/"/g, '').trim(),
                        name: cols[1]?.replace(/"/g, '').trim(),
                        desc: cols[2]?.replace(/"/g, '').trim(),
                        price: cols[3]?.replace(/"/g, '').trim(),
                        photo: cols[4]?.replace(/"/g, '').trim()
                    };
                }).filter(item => item && item.name);

                renderMenu(menuData);
            } catch (error) {
                document.getElementById('menuContent').innerHTML = "<p style='text-align:center'>تأكد من نشر الشيت كـ CSV وإتاحة الوصول للجميع.</p>";
            }
        }

        function renderMenu(data) {
            const menuContent = document.getElementById('menuContent');
            const catNav = document.getElementById('catNav');
            menuContent.innerHTML = "";
            catNav.innerHTML = "";

            const sections = [...new Set(data.map(item => item.section))];

            sections.forEach((sec, index) => {
                const activeClass = index === 0 ? 'active' : '';
                catNav.innerHTML += `
                    <div class="cat-item ${activeClass}" onclick="scrollToSection('${sec}', this)">
                        <div class="cat-icon"><i class="fas fa-utensils"></i></div>
                        <span>${sec}</span>
                    </div>
                `;

                let sectionHtml = `<h2 class="section-title" id="sec-${sec}">${sec}</h2>`;
                const items = data.filter(i => i.section === sec);
                
                items.forEach(item => {
                    sectionHtml += `
                        <div class="food-card">
                            <div class="food-info">
                                <h3 class="food-name">${item.name}</h3>
                                <p class="food-desc">${item.desc}</p>
                                <div class="food-footer">
                                    <span class="food-price">${item.price} EGP</span>
                                    <div class="add-btn"><i class="fas fa-plus"></i></div>
                                </div>
                            </div>
                            <img src="${imgBaseUrl}${item.photo}" class="food-img" onerror="this.src='https://via.placeholder.com/150/111/c5a059?text=Abokhader'">
                        </div>
                    `;
                });
                menuContent.innerHTML += sectionHtml;
            });
        }

        function scrollToSection(id, el) {
            document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            const target = document.getElementById('sec-' + id);
            if (target) {
                const offset = 120; 
                const bodyRect = document.body.getBoundingClientRect().top;
                const elementRect = target.getBoundingClientRect().top;
                const elementPosition = elementRect - bodyRect;
                const offsetPosition = elementPosition - offset;

                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
            }
        }

        fetchMenu();
    </script>
</body>
</html>
