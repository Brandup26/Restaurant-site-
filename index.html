<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منيو أبو خضر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --gold: #c5a059; --dark-bg: #050505; --card-bg: #111; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Cairo', sans-serif; overflow-x: hidden; }

        /* Header */
        .header { height: 200px; background: linear-gradient(rgba(0,0,0,0.4), var(--dark-bg)), url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=800'); background-size: cover; background-position: center; position: relative; }
        .logo-area { position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%); text-align: center; width: 100%; }
        .logo-circle { width: 90px; height: 90px; background: var(--card-bg); border: 2.5px solid var(--gold); border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: var(--gold); box-shadow: 0 8px 25px rgba(0,0,0,0.7); }

        /* Navigation */
        .category-nav { margin-top: 80px; display: flex; overflow-x: auto; padding: 15px; gap: 15px; position: sticky; top: 0; background: rgba(5,5,5,0.9); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid #1a1a1a; scrollbar-width: none; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-item { min-width: 85px; text-align: center; opacity: 0.4; transition: 0.3s; cursor: pointer; }
        .cat-item.active { opacity: 1; color: var(--gold); }
        .cat-icon { width: 50px; height: 50px; background: #161616; border-radius: 15px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; border: 1px solid rgba(197,160,89,0.1); font-size: 1.2rem; }
        .cat-item.active .cat-icon { border-color: var(--gold); }

        /* Menu Content */
        .menu-container { padding: 20px; }
        .section-title { color: var(--gold); font-size: 1.3rem; margin: 30px 0 15px; border-right: 4px solid var(--gold); padding-right: 12px; }
        
        .food-card { background: var(--card-bg); border-radius: 15px; padding: 12px; margin-bottom: 15px; display: flex; gap: 12px; align-items: center; border: 1px solid #1a1a1a; }
        .food-info { flex: 1; }
        .food-name { font-size: 1rem; font-weight: 700; margin-bottom: 3px; }
        
        /* الوصف المطلوب: صغير جداً ومنظم */
        .food-desc { font-size: 10px; color: #666; line-height: 1.3; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .food-footer { display: flex; justify-content: space-between; align-items: center; }
        .food-price { color: var(--gold); font-weight: 700; font-size: 1rem; }
        .add-btn { background: #062c21; color: var(--gold); border: 1px solid var(--gold); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        
        .food-img { width: 90px; height: 90px; border-radius: 12px; object-fit: cover; background: #222; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <div class="logo-circle">أ</div>
            <h2 style="color: var(--gold); margin-top: 10px;">أبو خضر</h2>
        </div>
    </div>

    <div class="category-nav" id="catNav"></div>
    <div class="menu-container" id="menuContent"></div>

    <script>
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzOW2Z2TFsXm8b7uV8QcVqY1HKF0Qq-Dxyeq2c6avxRsm9PjqXGvM4yyIWRV30DqblUB3BEMeXpI-a/pub?output=csv";
        const imgBaseUrl = "https://raw.githubusercontent.com/YOUR_USER/YOUR_REPO/main/images/";

        async function initMenu() {
            const res = await fetch(sheetUrl);
            const csv = await res.text();
            const lines = csv.split('\n').slice(1);
            
            // 1. تجميع البيانات وتنظيفها لمنع التكرار (Grouping)
            const groupedData = {};
            
            lines.forEach(line => {
                const col = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                let section = col[0]?.replace(/"/g, '').trim(); // تنظيف اسم القسم
                
                if (section && col[1]) {
                    if (!groupedData[section]) groupedData[section] = [];
                    groupedData[section].push({
                        name: col[1]?.replace(/"/g, '').trim(),
                        desc: col[2]?.replace(/"/g, '').trim(),
                        price: col[3]?.replace(/"/g, '').trim(),
                        photo: col[4]?.replace(/"/g, '').trim()
                    });
                }
            });

            render(groupedData);
        }

        function render(groupedData) {
            const nav = document.getElementById('catNav');
            const content = document.getElementById('menuContent');
            const sections = Object.keys(groupedData);

            sections.forEach((sec, idx) => {
                // إضافة الأزرار (مرة واحدة لكل قسم)
                nav.innerHTML += `
                <div class="cat-item ${idx===0?'active':''}" onclick="scrollToSection(this, 'sec-${idx}')">
                    <div class="cat-icon"><i class="fas fa-hamburger"></i></div>
                    <span>${sec}</span>
                </div>`;

                // إضافة المحتوى
                let html = `<h2 class="section-title" id="sec-${idx}">${sec}</h2>`;
                groupedData[sec].forEach(item => {
                    html += `
                    <div class="food-card">
                        <div class="food-info">
                            <div class="food-name">${item.name}</div>
                            <div class="food-desc">${item.desc}</div>
                            <div class="food-footer">
                                <span class="food-price">${item.price} EGP</span>
                                <div class="add-btn"><i class="fas fa-plus"></i></div>
                            </div>
                        </div>
                        <img src="${imgBaseUrl}${item.photo}" class="food-img" onerror="this.src='https://via.placeholder.com/90/111/c5a059?text=Food'">
                    </div>`;
                });
                content.innerHTML += html;
            });
        }

        function scrollToSection(el, id) {
            document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            const target = document.getElementById(id);
            window.scrollTo({ top: target.offsetTop - 100, behavior: 'smooth' });
        }

        initMenu();
    </script>
</body>
</html>
