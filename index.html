<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو خضر - القائمة الرقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --main-green: #062c21;
            --accent-gold: #c5a059;
            --bg-dark: #050505;
            --card-bg: #111111;
            --text-muted: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; }

        /* Cover & Logo Area */
        .cover-area {
            height: 220px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), var(--bg-dark)), 
                        url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 20px;
        }

        .logo-circle {
            width: 90px;
            height: 90px;
            background: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .restaurant-name { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--accent-gold); }

        /* Sticky Category Bar */
        .category-wrapper {
            position: sticky;
            top: 0;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(15px);
            z-index: 100;
            border-bottom: 1px solid rgba(197, 160, 89, 0.1);
            overflow-x: auto;
            white-space: nowrap;
            padding: 15px 10px;
            scrollbar-width: none; /* Firefox */
        }
        .category-wrapper::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .cat-item {
            display: inline-block;
            padding: 8px 20px;
            margin: 0 5px;
            border-radius: 25px;
            font-size: 0.9rem;
            color: white;
            transition: 0.3s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .cat-item.active {
            background: var(--main-green);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            font-weight: bold;
        }

        /* Menu Items */
        .menu-container { padding: 20px; }
        .category-title {
            color: var(--accent-gold);
            font-size: 1.3rem;
            margin: 30px 0 20px;
            padding-right: 10px;
            border-right: 3px solid var(--accent-gold);
        }

        .food-item {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 12px;
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .food-item:active { transform: scale(0.97); }

        .item-details { flex: 1; padding-left: 15px; }
        .item-name { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
        .item-desc { color: var(--text-muted); font-size: 0.8rem; line-height: 1.4; }
        
        .item-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .item-price { color: var(--accent-gold); font-weight: bold; }

        .add-btn {
            background: var(--main-green);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            width: 35px; height: 35px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }

        .item-img {
            width: 100px; height: 100px;
            border-radius: 12px;
            object-fit: cover;
        }

        /* Bottom Floating Cart Area */
        .bottom-cart {
            position: fixed;
            bottom: 20px;
            left: 5%;
            width: 90%;
            background: var(--accent-gold);
            color: var(--main-green);
            padding: 15px 25px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            display: none; /* Hide until items added */
        }
    </style>
</head>
<body>

    <section class="cover-area">
        <div class="logo-circle">
            <span style="color: var(--accent-gold); font-weight: bold; font-size: 2rem;">أ</span>
        </div>
        <h1 class="restaurant-name">أبو خضر</h1>
    </section>

    <div class="category-wrapper">
        <div class="cat-item active">المقبلات</div>
        <div class="cat-item">المشاوي</div>
        <div class="cat-item">البيتزا</div>
        <div class="cat-item">الحلويات</div>
        <div class="cat-item">المشروبات</div>
    </div>

    <div class="menu-container">
        <h2 class="category-title">المقبلات</h2>

        <!-- Food Item -->
        <div class="food-item">
            <div class="item-details">
                <div class="item-name">سلطة سيزر ملكية</div>
                <div class="item-desc">خس طازج مع صوص سيزر، قطع دجاج مشوية وخبز محمص.</div>
                <div class="item-footer">
                    <span class="item-price">120 EGP</span>
                    <button class="add-btn" onclick="addToCart()"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <img src="https://images.unsplash.com/photo-1550317144-47ba2303d9b4?auto=format&fit=crop&w=300&q=80" class="item-img" alt="food">
        </div>
        
        <!-- Add more items here -->
    </div>

    <div class="bottom-cart" id="floating-cart">
        <span>3 أصناف في السلة</span>
        <span>عرض السلة <i class="fas fa-chevron-left"></i></span>
    </div>

    <script>
        function addToCart() {
            document.getElementById('floating-cart').style.display = 'flex';
        }

        // تحريك شريط الأقسام عند النقر
        const categories = document.querySelectorAll('.cat-item');
        categories.forEach(cat => {
            cat.addEventListener('click', function() {
                categories.forEach(c => c.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
