<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منيو أبو خضر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --gold: #c5a059; --dark-bg: #050505; --card-bg: #111; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Cairo', sans-serif; }

        /* Header */
        .header { height: 220px; background: linear-gradient(rgba(0,0,0,0.5), var(--dark-bg)), url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=800'); background-size: cover; background-position: center; position: relative; }
        .logo-area { position: absolute; bottom: -45px; left: 50%; transform: translateX(-50%); text-align: center; width: 100%; }
        .logo-circle { width: 95px; height: 95px; background: var(--card-bg); border: 3px solid var(--gold); border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }

        /* Navigation - منع تكرار الأقسام */
        .category-nav { margin-top: 90px; display: flex; overflow-x: auto; padding: 15px; gap: 15px; position: sticky; top: 0; background: rgba(5,5,5,0.95); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid #222; scrollbar-width: none; }
        .category-nav::-webkit-scrollbar { display: none; }
        .cat-item { min-width: 90px; text-align: center; opacity: 0.4; transition: 0.3s; cursor: pointer; }
        .cat-item.active { opacity: 1; color: var(--gold); }
        .cat-icon { width: 55px; height: 55px; background: #1a1a1a; border-radius: 15px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; border: 1px solid rgba(197,160,89,0.2); font-size: 1.3rem; }

        /* Menu Content */
        .menu-container { padding: 20px; }
        .section-title { color: var(--gold); font-size: 1.4rem; margin: 40px 0 20px; border-right: 5px solid var(--gold); padding-right: 15px; }
        
        .food-card { background: var(--card-bg); border-radius: 18px; padding: 15px; margin-bottom: 15px; display: flex; gap: 15px; align-items: center; border: 1px solid #1a1a1a; }
        .food-info { flex: 1; }
        .food-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
        
        /* الوصف: صغير جداً كما طلبت */
        .food-desc { font-size: 10px; color: #777; line-height: 1.4; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .food-footer { display: flex; justify-content: space-between; align-items: center; }
        .food-price { color: var(--gold); font-weight: 700; font-size: 1.1rem; }
        .add-btn { background: #062c21; color: var(--gold); border: 1px solid var(--gold); width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        
        .food-img { width: 95px; height: 95px; border-radius: 15px; object-fit: cover; background: #222; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <div class="logo-circle">أ</div>
            <h2 style="color: var(--gold); margin-top: 15px;">أبو خضر</h2>
        </div>
    </div>

    <div class="category-nav" id="catNav"></div>
    <div class="menu-container" id="menuContent"></div>

    <script>
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzOW2Z2TFsXm8b7uV8QcVqY1HKF0Qq-Dxyeq2c6avxRsm9PjqXGvM4yyIWRV30DqblUB3BEMeXpI-a/pub?output=csv";
        const imgBaseUrl = "https://raw.githubusercontent.com/YOUR_USER/YOUR_REPO/main/images/";

        async function init() {
            const res = await fetch(sheetUrl);
            const csv = await res.text();
            const lines = csv.split(/\r?\n/).slice(1);
            
            // تجميع الأصناف في أقسام موحدة لمنع التكرار (Grouping Logic)
            const menuData = {};

            lines.forEach(line => {
                const col = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const section = col[0]?.replace(/"/g, '').trim();
                
                if (section && col[1]) {
                    if (!menuData[section]) menuData[section] = [];
                    menuData[section].push({
                        name: col[1]?.replace(/"/g, '').trim(),
                        desc: col[2]?.replace(/"/g, '').trim(),
                        price: col[3]?.replace(/"/g, '').trim(),
                        photo: col[4]?.replace(/"/g, '').trim()
                    });
                }
            });

            render(menuData);
        }

        function render(menuData) {
            const nav = document.getElementById('catNav');
            const content = document.getElementById('menuContent');
            const sections = Object.keys(menuData);

            sections.forEach((sec, idx) => {
                // إنشاء زرار واحد لكل قسم في الـ Nav
                nav.innerHTML += `
                <div class="cat-item ${idx===0?'active':''}" onclick="scrollToSection(this, 'sec-${idx}')">
                    <div class="cat-icon"><i class="fas fa-utensils"></i></div>
                    <span>${sec}</span>
                </div>`;

                // إنشاء حاوية القسم والأصناف التابعة له
                let sectionHtml = `<h2 class="section-title" id="sec-${idx}">${sec}</h2>`;
                menuData[sec].forEach(item => {
                    sectionHtml += `
                    <div class="food-card">
                        <div class="food-info">
                            <div class="food-name">${item.name}</div>
                            <div class="food-desc">${item.desc}</div>
                            <div class="food-footer">
                                <span class="food-price">${item.price} EGP</span>
                                <div class="add-btn"><i class="fas fa-plus"></i></div>
                            </div>
                        </div>
                        <img src="${imgBaseUrl}${item.photo}" class="food-img" onerror="this.src='https://via.placeholder.com/95/111/c5a059?text=Abokhader'">
                    </div>`;
                });
                content.innerHTML += sectionHtml;
            });
        }

        function scrollToSection(el, id) {
            document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            const target = document.getElementById(id);
            window.scrollTo({ top: target.offsetTop - 110, behavior: 'smooth' });
        }

        init();
    </script>
</body>
</html>
