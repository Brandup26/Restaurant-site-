<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ليالي الشام | منيو مطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fdfdfd;
            --main-text: #2d3436;
            --desc-text: #7f8c8d; /* لون الوصف المختلف */
            --accent: #e67e22; /* لون برتقالي فاتح للشهية */
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--main-text);
        }

        header {
            padding: 30px 20px;
            text-align: center;
            background: white;
        }

        header h1 { font-weight: 800; font-size: 1.8rem; color: var(--main-text); }

        /* الأقسام الأفقية */
        .category-nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px 20px 20px;
            gap: 15px;
            scrollbar-width: none;
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
            box-shadow: 0 10px 15px -10px rgba(0,0,0,0.05);
        }

        .category-nav::-webkit-scrollbar { display: none; }

        .cat-item {
            padding: 10px 25px;
            background: #f1f2f6;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s ease;
            font-size: 0.9rem;
            color: var(--desc-text);
        }

        .cat-item.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.3);
        }

        /* قائمة الطعام */
        .menu-list {
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        .food-card {
            background: var(--card-bg);
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f0f0f0;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .food-info {
            display: flex;
            flex-direction: column; /* جعل العناصر تحت بعضها */
            gap: 4px; /* مسافة بسيطة بين الاسم والوصف */
        }

        .food-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--main-text);
        }

        /* ستايل الوصف اللي طلبته */
        .food-desc {
            font-size: 0.85rem; /* خط أصغر */
            color: var(--desc-text); /* لون مختلف */
            font-weight: 400;
            line-height: 1.3;
            max-width: 250px; /* لا يأخذ مساحة السعر */
        }

        .food-price {
            font-weight: 800;
            color: var(--accent);
            font-size: 1rem;
            min-width: 80px;
            text-align: left;
        }

        #loader { text-align: center; margin-top: 50px; color: var(--desc-text); }
    </style>
</head>
<body>

    <header>
        <h1>ليالي الشام</h1>
    </header>

    <div class="category-nav" id="catNav"></div>

    <div class="menu-list" id="menuList">
        <div id="loader">تحميل قائمة الطعام...</div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRzOW2Z2TFsXm8b7uV8QcVqY1HKF0Qq-Dxyeq2c6avxRsm9PjqXGvM4yyIWRV30DqblUB3BEMeXpI-a/pub?output=csv';
        let menuData = [];

        async function loadMenu() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                
                menuData = rows.map(row => {
                    const col = row.split(',');
                    return {
                        category: col[0]?.trim(),
                        name: col[1]?.trim(),
                        price: col[2]?.trim(),
                        desc: col[3]?.trim() || "" // الوصف من العمود الرابع
                    };
                }).filter(i => i.name);

                renderNav();
                showCategory(menuData[0].category);
            } catch (e) {
                document.getElementById('loader').innerText = "خطأ في الاتصال بالبيانات";
            }
        }

        function renderNav() {
            const categories = [...new Set(menuData.map(i => i.category))];
            const nav = document.getElementById('catNav');
            nav.innerHTML = categories.map((cat, idx) => `
                <div class="cat-item ${idx === 0 ? 'active' : ''}" onclick="showCategory('${cat}', this)">
                    ${cat}
                </div>
            `).join('');
        }

        function showCategory(catName, el) {
            if(el) {
                document.querySelectorAll('.cat-item').forEach(btn => btn.classList.remove('active'));
                el.classList.add('active');
            }

            const list = document.getElementById('menuList');
            const items = menuData.filter(i => i.category === catName);

            list.innerHTML = items.map(item => `
                <div class="food-card">
                    <div class="food-info">
                        <span class="food-name">${item.name}</span>
                        ${item.desc ? `<span class="food-desc">${item.desc}</span>` : ''}
                    </div>
                    <div class="food-price">${item.price} ج.م</div>
                </div>
            `).join('');
        }

        loadMenu();
    </script>
</body>
</html>
